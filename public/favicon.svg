<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fv-gold" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FDF0C0"/>
      <stop offset="35%" stop-color="#E8C46A"/>
      <stop offset="65%" stop-color="#C99A2E"/>
      <stop offset="100%" stop-color="#7A5410"/>
    </linearGradient>
    <radialGradient id="fv-lens" cx="40%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#3A3030"/>
      <stop offset="65%" stop-color="#141010"/>
      <stop offset="100%" stop-color="#080606"/>
    </radialGradient>
    <radialGradient id="fv-hub" cx="38%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFF8E8"/>
      <stop offset="45%" stop-color="#D4A030"/>
      <stop offset="100%" stop-color="#6B4510"/>
    </radialGradient>
    <filter id="fv-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#D4A030" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark tile -->
  <rect width="64" height="64" rx="14" fill="#141010"/>

  <!-- Aperture + Compass Mark (centred at 32,32, ~26 unit radius) -->
  <g filter="url(#fv-glow)" transform="translate(32,32)">
    <!-- Outer rim -->
    <circle r="26" stroke="url(#fv-gold)" stroke-width="1.6" fill="#1A1210"/>
    <!-- Gold body disc -->
    <circle r="24" fill="url(#fv-gold)"/>
    <!-- 6 Aperture blades -->
    <path d="M0,-15 C8,-14 15,-8 15,0 L9,5 C4,1 -1,-5 -5,-10 Z" fill="#1A1210" opacity="0.9"/>
    <path d="M15,0 C14,8 8,15 0,15 L-5,9 C1,5 6,0 9,-5 Z" fill="#1A1210" opacity="0.9"/>
    <path d="M0,15 C-8,14 -15,8 -15,0 L-9,-5 C-4,-1 1,5 5,10 Z" fill="#1A1210" opacity="0.9"/>
    <path d="M-15,0 C-14,-8 -8,-15 0,-15 L5,-9 C-1,-5 -6,0 -9,5 Z" fill="#1A1210" opacity="0.9"/>
    <path d="M0,-15 C-8,-14 -15,-8 -15,0 L-9,5 C-4,1 2,-4 6,-9 Z" fill="#1A1210" opacity="0.65"/>
    <path d="M15,0 C14,8 8,15 0,15 L5,8 C1,4 -4,-1 -9,-6 Z" fill="#1A1210" opacity="0.65"/>
    <!-- Lens bowl -->
    <circle r="10.5" fill="url(#fv-lens)" stroke="#3A2A1A" stroke-width="0.9"/>
    <!-- Compass spokes -->
    <line x1="0" y1="-8" x2="0" y2="8" stroke="url(#fv-gold)" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="url(#fv-gold)" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="-5.5" y1="-5.5" x2="5.5" y2="5.5" stroke="url(#fv-gold)" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="5.5" y1="-5.5" x2="-5.5" y2="5.5" stroke="url(#fv-gold)" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
    <!-- Compass diamond tips -->
    <polygon points="0,-8 1.5,-5.5 0,-3.5 -1.5,-5.5" fill="url(#fv-gold)"/>
    <polygon points="8,0 5.5,1.5 3.5,0 5.5,-1.5" fill="url(#fv-gold)"/>
    <polygon points="0,8 1.5,5.5 0,3.5 -1.5,5.5" fill="url(#fv-gold)"/>
    <polygon points="-8,0 -5.5,1.5 -3.5,0 -5.5,-1.5" fill="url(#fv-gold)"/>
    <!-- Hub -->
    <circle r="2.5" fill="url(#fv-hub)" stroke="#C99A2E" stroke-width="0.6"/>
  </g>
</svg>